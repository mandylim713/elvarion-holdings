{% load static %}
<div id="mobileNavOverlay" class="mobile-nav-overlay">
    <div class="mobile-nav-inner">
        <button class="mobile-nav-close" id="mobileNavClose" aria-label="Close">
            <i class="fas fa-times"></i>
        </button>

        <div class="brand-logo mb-32">{% include 'partials/_brand.html' %}</div>

        <nav class="mobile-nav-links">
            {% include 'partials/_nav_items.html' %}
        </nav>

        <div class="mobile-nav-actions">
            {% if user.is_authenticated %}
                {% if user.is_staff %}
                    <a href="{% url 'admin_management' %}" class="btn btn-outline-gold btn-block">
                        <i class="fas fa-sliders"></i> Admin Desk
                    </a>
                {% endif %}
                <a href="{% url 'dashboard' %}" class="btn btn-gold btn-block">
                    <i class="fas fa-wallet"></i> Investor Portal
                </a>
                <a href="{% url 'logout' %}" class="btn btn-outline-subtle btn-block">
                    <i class="fas fa-right-from-bracket"></i> Sign Out
                </a>
            {% else %}
                <a href="{% url 'register' %}" class="btn btn-gold btn-block">
                    <i class="fas fa-vault"></i> Open Account
                </a>
                <a href="{% url 'login' %}" class="btn btn-outline-gold btn-block">
                    <i class="fas fa-user-lock"></i> Client Sign In
                </a>
            {% endif %}
        </div>
    </div>
</div>
