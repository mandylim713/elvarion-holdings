{# Home: loan qualification tier card. #}
<div class="glass-card-luxury loan-tier-card {% if forloop.counter == 2 %}highlight{% endif %}">
    <span class="badge badge-gold mb-16">{{ tier.badge }}</span>

    <div class="loan-threshold-circle">
        <span class="threshold-amount">${{ tier.min_deposit_required|floatformat:0 }}</span>
        <span class="threshold-sub">Deposit</span>
    </div>

    <div class="text-dim home-tier-caps">
        Unlocks Eligible Loan Range:
    </div>

    <div class="eligible-loan-range">
        ${{ tier.min_loan_amount|floatformat:0 }} - ${{ tier.max_loan_amount|floatformat:0 }}
    </div>

    <p class="text-muted home-tier-perks">
        {{ tier.perks_description }}
    </p>

    <a href="{% url 'register' %}" class="btn btn-sm btn-outline-gold u-w-full">
        Qualify For This Tier
    </a>
</div>
