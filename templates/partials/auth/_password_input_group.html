{# Password input group with reveal toggle. #}
{# Params: input_id, input_name, placeholder, required (bool), on_input (optional oninput hook), input_class (extra) #}
<div class="password-input-group">
    <input type="password" id="{{ input_id }}" name="{{ input_name }}" class="form-control {{ input_class|default:'' }}" placeholder="{{ placeholder }}"{% if required %} required{% endif %}{% if on_input %} oninput="{{ on_input }}"{% endif %}>
    <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('{{ input_id }}', this)" aria-label="Toggle password visibility">
        <i class="fas fa-eye"></i>
    </button>
</div>
