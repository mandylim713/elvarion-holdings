{# Identifier / email text field with split label (text + shield icon). #}
{# Params: label_text, label_icon, input_type, input_id, input_name, placeholder, #}
{#         required (bool), autofocus (bool), input_class (extra) #}
<div class="form-group">
    <label class="form-label auth-label-split">
        <span>{{ label_text }} <span class="text-danger">*</span></span>
        <i class="fas {{ label_icon }} text-gold auth-label-icon"></i>
    </label>
    <input type="{{ input_type }}" id="{{ input_id }}" name="{{ input_name }}" class="form-control {{ input_class|default:'' }}" placeholder="{{ placeholder }}"{% if required %} required{% endif %}{% if autofocus %} autofocus{% endif %}>
</div>
