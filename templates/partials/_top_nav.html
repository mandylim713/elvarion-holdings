{% load static %}
<nav class="luxury-navbar">
    <div class="nav-container">
        <a href="{% url 'home' %}" class="brand-logo">{% include 'partials/_brand.html' %}</a>

        <ul class="nav-links">
            {% include 'partials/_nav_items.html' %}
        </ul>

        <button class="nav-hamburger" id="navHamburger" aria-label="Open navigation">
            <span></span><span></span><span></span>
        </button>

        <div class="nav-actions">
            {% if user.is_authenticated %}
                {% if user.is_staff %}
                    <a href="{% url 'admin_management' %}" class="btn btn-sm btn-outline-gold">
                        <i class="fas fa-sliders"></i> Admin Desk
                    </a>
                {% endif %}
                <a href="{% url 'dashboard' %}" class="btn btn-sm btn-gold">
                    <i class="fas fa-wallet"></i> Investor Portal
                </a>
                <a href="{% url 'logout' %}" class="btn btn-sm btn-outline-subtle" title="Sign Out">
                    <i class="fas fa-right-from-bracket"></i>
                </a>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-sm btn-outline-gold">
                    <i class="fas fa-user-lock"></i> Client Sign In
                </a>
                <a href="{% url 'register' %}" class="btn btn-sm btn-gold">
                    <i class="fas fa-vault"></i> Open Account
                </a>
            {% endif %}
        </div>
    </div>
</nav>
