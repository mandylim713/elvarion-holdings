{% if messages %}
<div class="toast-container">
    {% for message in messages %}
    <div class="toast-msg toast-{{ message.tags }}">
        {% if message.tags == 'success' %}
            <i class="fas fa-circle-check text-emerald"></i>
        {% elif message.tags == 'error' %}
            <i class="fas fa-circle-exclamation text-danger"></i>
        {% else %}
            <i class="fas fa-circle-info text-cyan"></i>
        {% endif %}
        <span>{{ message }}</span>
    </div>
    {% endfor %}
</div>
{% endif %}
