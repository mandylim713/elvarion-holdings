{# Reusable control-desk stat tile — included 5x from _quick_stats.html. Expects: label, value, tone (one of amber|mint|violet|plain|cyan). #}
<div class="glass-card-luxury p-22">
    <div class="mgmt-stat-label">{{ label }}</div>
    <div class="mono-num mgmt-stat-value mgmt-stat-value--{{ tone }}">
        {{ value }}
    </div>
</div>
