# ============================================================================
#  Elvarion Holdings — Render Blueprint (one-click deploy)
#  New → Blueprint → connect mandylim713/elvarion-holdings → Render auto-creates everything.
# ============================================================================
databases:
  - name: elvarion-db
    databaseName: elvarion
    user: elvarion_user
    plan: free

services:
  - type: web
    name: elvarion-holdings
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn elvarion_project.wsgi:application"
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: elvarion-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "4"
      # ---- Email codes (sign-up, sign-in, password reset) & admin alerts via Resend API
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "Elvarion Holdings <support@elvarionholdings.com>"
      - key: EMAIL_HOST            # optional fallback: any SMTP server (also set EMAIL_HOST_USER / EMAIL_HOST_PASSWORD)
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: CRON_SECRET           # optional: fixed key for the /cron/tick/ ping URL (otherwise one is derived)
        generateValue: true
