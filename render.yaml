# ============================================================================
#  Elvarion Holdings — Render Blueprint (one-click deploy)
#  New → Blueprint → connect mandylim713/elvarion-holdings → Render auto-creates everything.
# ============================================================================
databases:
  - name: elvarion-db
    databaseName: elvarion
    user: elvarion_user
    plan: free

services:
  - type: web
    name: elvarion-holdings
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn elvarion_project.wsgi:application"
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: elvarion-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "4"
