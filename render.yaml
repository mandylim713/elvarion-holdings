# ============================================================================
#  Elvarion Holdings — Render Blueprint (one-click deploy)
#  New → Blueprint → connect mandylim713/elvarion-holdings → Render auto-creates everything.
#
#  REQUIRED: After first deploy, go to Render Dashboard → elvarion-holdings → Environment
#  and add:   RESEND_API_KEY = your-resend-api-key
#  Everything else is fully automatic.
# ============================================================================
databases:
  - name: elvarion-db
    databaseName: elvarion
    user: elvarion_user
    plan: free

services:
  - type: web
    name: elvarion-holdings
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn elvarion_project.wsgi:application"
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: elvarion-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "4"
      # ---- Email / Resend (set RESEND_API_KEY in Render dashboard → Environment)
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "Elvarion Holdings <support@elvarionholdings.com>"
      - key: EMAIL_HOST            # optional SMTP fallback
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: CRON_SECRET
        generateValue: true
